<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Companion | Access Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Google+Sans+Display:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root {
    --g-black:        #050508;
    --g-space:        #0a0a10;
    --g-surface:      rgba(15, 15, 23, 0.45);
    --g-surface-elev: rgba(22, 22, 34, 0.75);
    --g-input-bg:      rgba(10, 10, 15, 0.85);
    --g-border:        rgba(255, 255, 255, 0.04);
    --g-border-glow:  rgba(116, 96, 238, 0.25);
    --g-border-focus: #a8c7fa;

    --gemini-blue:   #1a73e8;
    --gemini-purple: #7460ee;
    --gemini-pink:   #c74591;
    --gemini-teal:   #13b5cb;

    --text-primary:   #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted:      #64748b;

    --error-color:  #f87171;
    --error-bg:     rgba(248, 113, 113, 0.04);
    --error-border: rgba(248, 113, 113, 0.12);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--g-black);
    color: var(--text-primary);
    font-family: 'Google Sans', sans-serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

/* Ambient Animated Blur Elements */
.ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    transform: translateZ(0);
    contain: strict;
}

.amb-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.25;
    mix-blend-mode: screen;
    will-change: transform;
    animation: morphingAura var(--dur, 25s) ease-in-out infinite alternate;
}

.amb-orb-1 {
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(26,115,232,0.2) 0%, transparent 70%);
    top: -20%; right: -10%;
    --dur: 22s;
}
.amb-orb-2 {
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(116,96,238,0.15) 0%, transparent 70%);
    bottom: -20%; left: -5%;
    --dur: 28s;
    animation-delay: -4s;
}

@keyframes morphingAura {
    0%   { transform: translate3d(0,   0,   0) scale(1)    rotate(0deg);   }
    50%  { transform: translate3d(40px,-20px,0) scale(1.05) rotate(60deg);  }
    100% { transform: translate3d(0,   0,   0) scale(1)    rotate(120deg); }
}

.digital-grid {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(circle at 50% 50%, white, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, white, transparent 85%);
    z-index: 1;
    pointer-events: none;
}

/* Main Container Window */
.card-shell {
    width: 100%;
    max-width: 440px;
    background: var(--g-surface);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border-radius: 32px;
    border: 1px solid var(--g-border);
    box-shadow: 0 4px 40px rgba(0,0,0,0.5), 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    position: relative;
    z-index: 10;
    transition: background-color 0.4s, border-color 0.4s, box-shadow 0.4s;
}

.card-shell:hover {
    background: var(--g-surface-elev);
    border-color: rgba(255,255,255,0.09);
    box-shadow: 0 4px 40px rgba(0,0,0,0.5), 0 35px 90px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.07);
}

/* Top Running Accent Line */
.card-shell::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #1a73e8, #7460ee, #c74591, #13b5cb, #1a73e8);
    background-size: 200% auto;
    animation: dynamicWave 4s linear infinite;
    z-index: 2;
}

@keyframes dynamicWave {
    0% { background-position: 0% center; }
    100% { background-position: -200% center; }
}

.card-inner {
    padding: 44px 36px;
    position: relative;
}

.header-zone {
    text-align: center;
    margin-bottom: 32px;
}

.brand-icon {
    display: inline-flex;
    margin-bottom: 16px;
}
.gem-svg { width: 32px; height: 32px; }

.header-zone h2 {
    font-family: 'Google Sans Display', sans-serif;
    font-size: 1.85rem;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 8px;
}

.header-zone p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    opacity: 0.8;
}

/* Forms & Input Elements */
.input-wrap {
    position: relative;
    margin-bottom: 16px;
}

.input-el {
    width: 100%;
    padding: 16px 20px;
    background: var(--g-input-bg);
    border: 1px solid rgba(255,255,255,0.03);
    border-radius: 14px;
    color: var(--text-primary);
    font-family: 'Google Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.input-el:hover:not(:focus) { border-color: rgba(255,255,255,0.08); }

.input-el:focus {
    background-color: #06060a;
    border-color: var(--g-border-focus);
    box-shadow: 0 0 0 4px rgba(168,199,250,0.05), inset 0 1px 2px rgba(0,0,0,0.5);
}

.input-el::placeholder { color: var(--text-muted); font-size: 0.92rem; }

.show-hide {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.8px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
}
.show-hide:hover { color: var(--g-border-focus); }

/* System Server Notifications Boxes */
.err-box {
    color: var(--error-color);
    font-size: 0.85rem;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 14px;
    line-height: 1.5;
    font-weight: 500;
    text-align: left;
}

/* Buttons */
.cta-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(92deg, #1a73e8 0%, #7460ee 45%, #c74591 75%, #1a73e8 100%);
    background-size: 200% auto;
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Google Sans', sans-serif;
    font-weight: 500;
    font-size: 0.98rem;
    cursor: pointer;
    transition: background-position 0.5s ease, box-shadow 0.25s ease, transform 0.15s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    margin-top: 8px;
}

.cta-btn:hover:not(:disabled) {
    background-position: 100% center;
    box-shadow: 0 12px 25px rgba(116,96,238,0.25);
    transform: translate3d(0, -1px, 0);
}
.cta-btn:active:not(:disabled) { transform: translate3d(0,0,0); }
.cta-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.route-switch {
    margin-top: 24px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
}
.route-switch a {
    color: #a8c7fa;
    font-weight: 500;
    text-decoration: none;
    padding-left: 4px;
    transition: color 0.2s, text-shadow 0.2s;
}
.route-switch a:hover {
    color: #f8fafc;
    text-shadow: 0 0 8px rgba(168,199,250,0.3);
}
</style>
</head>

<body>

<div class="ambient" aria-hidden="true">
    <div class="amb-orb amb-orb-1"></div>
    <div class="amb-orb amb-orb-2"></div>
</div>
<div class="digital-grid" aria-hidden="true"></div>

<div class="card-shell">
    <div class="card-inner">
        
        <div class="header-zone">
            <div class="brand-icon" aria-hidden="true">
                <svg class="gem-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%"   stop-color="#1a73e8"/>
                            <stop offset="50%"  stop-color="#7460ee"/>
                            <stop offset="100%" stop-color="#c74591"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 2C12 2 13.5 8.5 20 12C13.5 15.5 12 22 12 22C12 22 10.5 15.5 4 12C10.5 8.5 12 2 12 2Z" fill="url(#starGrad)"/>
                </svg>
            </div>
            <h2>Welcome back</h2>
            <p>Access your exam engineering platform environment</p>
        </div>

        {% if error %}
        <div class="err-box" role="alert">
            {{ error }}
        </div>
        {% endif %}
        
        <div id="clientErrorBox" class="err-box" style="display: none;" role="alert"></div>

        <form method="POST" action="/login" id="portalLoginForm" onsubmit="return validatePortalForm(this);">
            <div class="input-wrap">
                <input class="input-el" type="text" name="username" id="username" placeholder="Username or Email address" autocomplete="username" required>
            </div>
            
            <div class="input-wrap">
                <input class="input-el" type="password" name="password" id="password" placeholder="Account secure password" autocomplete="current-password" required>
                <span class="show-hide" onclick="togglePasswordVisibility('password', this)">SHOW</span>
            </div>

            <button type="submit" class="cta-btn" id="submitBtn">Authenticate Core</button>
        </form>

        <div class="route-switch">
            New operator? <a href="/register">Initialize workspace channel</a>
        </div>

    </div>
</div>

<script>
/* ── PASSWORD VISIBILITY TOGGLE ─────────────────────────────────────── */
function togglePasswordVisibility(inputId, triggerSpan) {
    const targetInput = document.getElementById(inputId);
    if (targetInput.type === "password") {
        targetInput.type = "text";
        triggerSpan.textContent = "HIDE";
    } else {
        targetInput.type = "password";
        triggerSpan.textContent = "SHOW";
    }
}

/* ── CLIENT-SIDE INTERFACE VALIDATOR ───────────────────────────────── */
function validatePortalForm(formElement) {
    const errorContainer = document.getElementById("clientErrorBox");
    const userField = document.getElementById("username").value.trim();
    const passwordField = document.getElementById("password").value;
    const submitButton = document.getElementById("submitBtn");

    errorContainer.style.display = "none";

    if (!userField || !passwordField) {
        errorContainer.textContent = "Security clearance check failed: All entry arguments are required.";
        errorContainer.style.display = "block";
        return false;
    }

    // Prevents double submissions during server round-trips
    submitButton.disabled = true;
    submitButton.textContent = "Processing Handshake...";
    return true;
}

/* ── OPTIONAL: AUTOMATICALLY INITIALIZE FIREBASE WEB INTERACTIVE GATE ── */
// If you want to use the native asynchronous client pipeline inside this file later,
// your active instance configuration sits ready here:
const firebaseConfig = {
    apiKey:     "AIzaSyDjLXdEoCaH3-zpalX_h4nTqtU-XM-4hBU",
    authDomain: "ai-exam-companion.firebaseapp.com",
    projectId:  "ai-exam-companion"
};
if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
}
</script>
</body>
</html>
